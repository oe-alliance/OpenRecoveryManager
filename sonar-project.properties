sonar.projectKey=oe-alliance_OpenRecoveryManager
sonar.organization=oe-alliance

# This is the name displayed in the SonarCloud UI, the version is ORM_VERSION of include/version.h.
sonar.projectName=Open Recovery Manager (ORM)

sonar.sourceEncoding=UTF-8

# LVGL is a submodule and the fonts are generated.
sonar.exclusions=lib/**,src/fonts/**

# ORM has no unit tests, the coverage is not measured.
sonar.coverage.exclusions=**/*

# Rules that do not fit a recovery tool that runs as root on the receiver.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
# Log injection: ORM writes only its own logs.
sonar.issue.ignore.multicriteria.e1.ruleKey=csecurity:S5145
sonar.issue.ignore.multicriteria.e1.resourceKey=src/**
# Publicly writable directories: the work folders in /tmp are made with mkdtemp or belong to ORM.
sonar.issue.ignore.multicriteria.e2.ruleKey=c:S5443
sonar.issue.ignore.multicriteria.e2.resourceKey=src/**
# File permissions: the files are for root on the receiver.
sonar.issue.ignore.multicriteria.e3.ruleKey=c:S2612
sonar.issue.ignore.multicriteria.e3.resourceKey=src/**
# Function names: enigma2 calls Plugins() of a plugin and names its functions in camelCase.
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S1542
sonar.issue.ignore.multicriteria.e4.resourceKey=plugin/**
